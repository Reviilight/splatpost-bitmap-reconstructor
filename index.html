<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splatpost Bitmap Reconstructor</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="main.js"></script>
</head>

<body>
    <main class="app">
        <h1>Splatpost Bitmap Reconstructor</h1>
        <p>A web tool that helps reconstruct the original pixel-perfect bitmap from a Splatoon's automatic screenshot of
            a post.</p>
        <p>Supported games:</p>
        <ul>
            <li>Splatoon 2 (Nintendo Switch)</li>
            <li>Splatoon 3 (Nintendo Switch /2)</li>
        </ul>
        <label for="og-image">Load the image:</label>
        <input type="file" id="og-image" accept="image/*">
        <h2>Original Image</h2>
        <p id="notice-wrapper"></p>
        <canvas id="canvas-og" class="splatpost" width="1280" height="720"></canvas>
        <h2>Reconstructed Image</h2>
        <div class="threshold-container">
            <label for="threshold">Threshold:</label>
            <input type="range" id="threshold" min="1" max="255" value="128" step="1">
            <span id="threshold-value">128</span>
            <button id="threshold-reset-btn">Reset to Default</button>
        </div>
        <canvas id="canvas-rc" class="splatpost" width="320" height="120"></canvas>
        <div><button id="download-btn">Save to Device</button></div>
        <!-- TODO: add options to mod the result -->
        <!-- 
        <h3>Options:</h3>
        <p>size</p>
        <p>format</p>
        <p>orientation</p>
         -->
        <br>
    </main>
    <footer>
        <a href="https://reviilight.github.io/" class="copyright">©2026 Reviilight</a>
    </footer>
    <br>
</body>

</html>
